<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link rel="icon" type="image/svg+xml" href="assets/images.jpeg" />
    <title>Sign-In — Amazon</title>
    <meta content="Sign in to your Amazon Clone account." name="description" />
    <meta content="Sign-In — Amazon Clone" property="og:title" />
    <meta content="Sign in to your Amazon Clone account." property="og:description" />
    <meta content="website" property="og:type" />
    <meta content="summary" name="twitter:card" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="styles/styles.css" rel="stylesheet" />

</head>

<body>
    <div class="az az-auth"><a class="az-logo1 dark" href="index.html"></a>

        <div class="ax-stack-item ax-stack-item--spacing-Base">
            <div id="ap_header" class="a-section a-spacing-none a-spacing-top-base a-text-center auth-navbar"><a
                    class="a-link-nav-icon" tabindex="-1" href="/ref=ap_frn_logo"><i class="a-icon a-icon-logo"
                        role="img" aria-label="Amazon"></i></a></div>
        </div>

        <form class="az-auth-box">
            <h1 style="font-size: 32px;">Sign in or create account</h1><label style="font-size: 14px;">
                Enter mobile
                number or email<input type="email" /></label><button class="az-btn" type="button">Continue</button>
            <p class="az-muted">By continuing, you agree to the <a href="/">Conditions of Use </a> and <a
                    href="/">Privacy Notice.</a> </p>

            <div class="a-section">
                <ul class="a-unordered-list a-nostyle a-vertical">
                    <li><span class="a-list-item"><a class="a-size-base a-link-normal" target="_blank"
                                rel="noopener noopener"
                                href="/gp/help/customer/account-issues/ref=unified_claim_collection?ie=UTF8"
                                role="button">Need
                                help?</a></span></li>
                </ul>
            </div>

            <div id="ab-registration-link-section" class="a-section a-spacing-none">
                <hr aria-hidden="true" class="a-divider-normal" style=" background-color: transparent;
    border-color: var(--__dChNmAwPaMXsTxp, #d5d9d9);
    border-top-width: 1px;
    border-top-style: solid;
    border-bottom-width: 0;
    border-left-width: 0;
    border-right-width: 0;
    display: block;
    height: 1px;
    line-height: 19px;
    margin-bottom: 14px;
    margin-top: 0;">
                <div class="a-section a-spacing-micro"><span class="a-text-bold">Buying for work?</span></div><a
                    id="ab-registration-ingress-link" class="a-link-normal"
                    href="/business/register/org/landing?ref_=ab_reg_signin_unifiedauth"><span>Create a free business
                        account</span></a>
            </div>
        </form>

        <div class="ax-stack-item ax-stack-item--spacing-Base">
            <div class="a-section a-spacing-top-extra-large auth-footer ax-page-footer">
                <div class="a-divider a-divider-section">
                    <div class="a-divider-inner"></div>
                </div>
                <div class="a-section a-spacing-small ax-page-footer__links" style="gap: 10px;">
                    <a class="a-size-mini a-link-normal"
                        target="_blank" rel="noopener noopener"
                        href="/gp/help/customer/display.html/ref=ap_desktop_footer_cou?nodeId=508088" >Conditions of
                        Use</a><a class="a-size-mini a-link-normal" style="gap: 2;" target="_blank" rel="noopener noopener"
                        href="/gp/help/customer/display.html/ref=ap_desktop_footer_privacy_notice?nodeId=468496"> Privacy
                        Notice</a>
                        <a class="a-size-mini a-link-normal" target="_blank" rel="noopener noopener"
                        href="/help"> Help</a>
                    </div>
                <div class="a-section a-text-center ax-page-footer__copyright-row"><span
                        class="a-size-mini a-color-secondary ax-page-footer__copyright">&copy; 1996-2026, Amazon.com, Inc. or
                        its affiliates</span></div>
            </div>
        </div>
        <script src="cart.js" defer></script>
</body>

</html>
